# ---------------------------------------------------------------------------
# Kinesis stream definitions used by KinesisPublisher to resolve logical
# stream names -> physical stream names in the configured AWS account.
# ---------------------------------------------------------------------------
streams:

  mes:
    name: mes-events
    shard_count: 1

  metadata:
    name: metadata-events
    shard_count: 1

  quality:
    name: quality-events
    shard_count: 1

  plm:
    name: plm-events
    shard_count: 1
