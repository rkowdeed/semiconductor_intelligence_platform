app:
  name: Semiconductor_Operations_Data_Platform
  owner_email: ravikanth.kowdeed@gmail.com
  version: "0.1.0"
  environment: ${APP_ENV:local}
  api:
    base_url: /api/v1
    title: Semiconductor_Operations_Data_Platform - Ingestion Service
    description: >
      AWS-native, metadata-driven data ingestion framework for
      semiconductor manufacturing data.
    docs_url: /docs
    redoc_url: /redoc
    openapi_url: /openapi.json
  cors:
    allow_origins: ["*"]
    allow_methods: ["*"]
    allow_headers: ["*"]

metadata:
  sources_file: metadata/sources.yaml
  mappings_file: metadata/mappings.yaml
  routing_file: metadata/routing.yaml
  validation_file: metadata/validation.yaml
  streams_file: metadata/streams.yaml
  data_categories_file: metadata/data_categories.yaml

health:
  checks:
    - database
    - localstack
    - kinesis
    - s3
    - application
